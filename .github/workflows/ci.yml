name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The plugins (@smaltdb/io, @smaltdb/external) are not on npm yet: build the commits pinned in packed.json and
      # install them, for the docs examples and the browser tests (scripts/fetch-packed.mjs).
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      - run: npm run typecheck
      - run: npm test
      # Every plan through its JSON form before it is planned (plan/codec.ts).
      - run: SMALT_PLAN_ROUNDTRIP=1 npm test

  browser:
    runs-on: ubuntu-latest
    # A run takes 1-2 minutes; a stuck step would otherwise hold the job for GitHub's 6 hours.
    timeout-minutes: 20
    # Playwright's image has its browsers and their system packages installed: no apt and no browser download here (the
    # runners' Ubuntu mirror was slow enough to stall jobs for many minutes). The image's version is the pinned
    # Playwright's, PLAYWRIGHT_VERSION below: raise both together, on purpose. As the runner's user, as Playwright's docs
    # set it up.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      # Pinned so a new release can't break CI unannounced (1.65.0 was published without its playwright-core).
      PLAYWRIGHT_VERSION: 1.64.1
      # Global installs where the runner's user can write.
      NPM_CONFIG_PREFIX: /tmp/npm-global
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The plugins (@smaltdb/io, @smaltdb/external) are not on npm yet: build the commits pinned in packed.json and
      # install them, for the docs examples and the browser tests (scripts/fetch-packed.mjs).
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      # Playwright is resolved globally (see test/browser/playwright.mjs) so local dev containers can use a preinstalled
      # copy; it finds the image's browsers.
      - run: npm install -g playwright@${{ env.PLAYWRIGHT_VERSION }}
        timeout-minutes: 5
      - run: NODE_PATH=$(npm root -g) BROWSERS=${{ matrix.browser }} npm run test:browser
