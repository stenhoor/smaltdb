name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The plugins (@smaltdb/io, @smaltdb/external) are not on npm yet: build the commits pinned in packed.json and
      # install them, for the docs examples and the browser tests (scripts/fetch-packed.mjs).
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      - run: npm run typecheck
      - run: npm test
      # The SQL front end must agree with the planner on every SELECT, and the physical planner on its operators
      # (ADR 0014, steps 5 and 6).
      - run: SMALT_PLAN=shadow npx vitest run
      # The planner's AST path (until it is deleted after step 8): the same plan shapes and generated code.
      - run: SMALT_PLAN=legacy npx vitest run test/plan-shapes.test.ts test/codegen-source.test.ts

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The plugins (@smaltdb/io, @smaltdb/external) are not on npm yet: build the commits pinned in packed.json and
      # install them, for the docs examples and the browser tests (scripts/fetch-packed.mjs).
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      # Playwright is resolved globally (see test/browser/playwright.mjs) so local dev containers can use a preinstalled copy.
      - run: npm install -g playwright && npx playwright install --with-deps ${{ matrix.browser }}
      - run: NODE_PATH=$(npm root -g) BROWSERS=${{ matrix.browser }} npm run test:browser
