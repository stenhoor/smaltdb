name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    # WebKit is non-blocking: Playwright's Linux WebKit fails before the OPFS test worker reports a
    # result (the runner now prints the worker error, console and page errors). Safari 17 remains a
    # support target; re-enable as blocking once the cause is fixed.
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright is resolved globally (see test/browser/playwright.mjs) so local dev containers can use a preinstalled copy.
      - run: npm install -g playwright && npx playwright install --with-deps ${{ matrix.browser }}
      - run: NODE_PATH=$(npm root -g) BROWSERS=${{ matrix.browser }} npm run test:browser
